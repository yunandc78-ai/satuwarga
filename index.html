<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SatuWarga 04 - Sistem Informasi & Kas RT 04 RW 14 Cisaranten Kulon</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo.png">

  <!-- Meta SEO & Social -->
  <meta name="description" content="Portal Terpadu Transparansi Kas, Iuran Bulanan 2026-2036, Layanan Surat Pengantar, dan e-Sensus Kependudukan RT 04 / RW 14 Kelurahan Cisaranten Kulon Arcamanik Bandung.">
  <meta name="theme-color" content="#064e3b">

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Phosphor Icons, Chart.js, & Canvas Confetti -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Tailwind CSS CDN with Custom Theme -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
              950: '#022c22',
            },
            accent: {
              50: '#f0f9ff',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
            },
            gold: {
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
            display: ['"Outfit"', '"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          boxShadow: {
            'glow-sm': '0 0 15px -3px rgba(16, 185, 129, 0.25)',
            'glow-md': '0 0 25px -5px rgba(16, 185, 129, 0.35)',
            'glow-blue': '0 0 25px -5px rgba(14, 165, 233, 0.3)',
            'inner-subtle': 'inset 0 1px 2px 0 rgba(255, 255, 255, 0.15)',
          },
          animation: {
            'pulse-subtle': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 4s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-6px)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar & Utilities */
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      background: radial-gradient(circle at 10% 10%, #064e3b 0%, #0f172a 45%, #020617 100%);
      min-height: 100vh;
    }
    
    .pb-safe {
      padding-bottom: max(env(safe-area-inset-bottom, 24px), 24px);
    }
    
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(16, 185, 129, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(16, 185, 129, 0.6);
    }

    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .app-mesh-bg {
      background-color: #f8fafc;
      background-image: 
        radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.12) 0px, transparent 45%),
        radial-gradient(at 100% 0%, rgba(14, 165, 233, 0.10) 0px, transparent 40%),
        radial-gradient(at 20% 60%, rgba(99, 102, 241, 0.05) 0px, transparent 40%),
        radial-gradient(at 95% 85%, rgba(16, 185, 129, 0.10) 0px, transparent 45%);
      background-attachment: fixed;
    }

    .glass-nav {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }

    .glass-card-dark {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Print styles */
    @media print {
      body * {
        visibility: hidden;
      }
      #printArea, #printArea * {
        visibility: visible;
      }
      #printArea {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body class="m-0 p-0 flex justify-center min-h-screen text-slate-800 antialiased selection:bg-brand-500 selection:text-white relative overflow-x-hidden">

  <!-- Ambient Light Orbs -->
  <div class="fixed top-8 left-1/3 -translate-x-1/2 w-[480px] h-[480px] bg-brand-500/15 rounded-full blur-[100px] pointer-events-none z-0"></div>
  <div class="fixed bottom-10 right-1/4 translate-x-1/2 w-[420px] h-[420px] bg-sky-400/10 rounded-full blur-[90px] pointer-events-none z-0"></div>

  <!-- Main View Container: Responsive (Mobile App on Mobile, Elegant wide tablet/desktop view) -->
  <div id="appContainer" class="w-full max-w-[1400px] mx-auto min-h-screen md:min-h-[96vh] md:my-2 rounded-none md:rounded-3xl app-mesh-bg flex flex-col overflow-hidden relative shadow-2xl border-x md:border border-slate-700/30 z-10 transition-all duration-300">
    
    <!-- Top Header Navigation -->
    <header class="flex-none z-50 glass-nav border-b border-emerald-100/90 px-3 sm:px-5 py-2.5 flex items-center justify-between gap-2 sm:gap-4 transition-all shadow-sm">
      <!-- Brand & RT 04 Logo -->
      <div class="flex items-center space-x-3 cursor-pointer select-none flex-shrink-0" onclick="switchTab('beranda')">
        <!-- Official Logo RT 04 Emblem -->
        <div class="w-10 h-10 rounded-2xl overflow-hidden shadow-md border border-slate-200/90 flex-shrink-0 bg-[#5b9dc9] flex items-center justify-center p-0.5 relative group">
          <img src="logo.png" alt="Logo RT 04" class="w-full h-full object-contain rounded-xl transform transition group-hover:scale-105" />
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-sm font-black font-display text-slate-900 tracking-tight leading-none">SatuWarga 04</h1>
            <span class="text-[9px] font-extrabold px-1.5 py-0.5 rounded-md bg-brand-100 text-brand-800 border border-brand-200 uppercase tracking-wide">RW 14</span>
          </div>
          <p class="text-[10.5px] text-slate-500 font-medium mt-0.5" id="headerSubtext">Portal Transparansi Kas & Layanan Warga</p>
        </div>
      </div>

      <!-- Center: Desktop Navigation Bar (Visible in Desktop Mode) -->
      <div id="desktopNavBar" class="hidden items-center justify-center space-x-1 lg:space-x-1.5 flex-1 max-w-2xl mx-auto overflow-x-auto py-0.5 scrollbar-none">
        <!-- Rendered dynamically -->
      </div>

      <!-- Right: View Mode Toggle & Auth Buttons -->
      <div class="flex items-center space-x-1.5 sm:space-x-2 flex-shrink-0">
        <!-- Toggle Mode Desktop / Mode Ponsel -->
        <div id="viewModeToggleContainer">
          <!-- Rendered dynamically -->
        </div>

        <!-- Auth Pengurus Container -->
        <div id="headerAuthContainer" class="flex items-center space-x-1.5">
          <!-- Rendered dynamically -->
        </div>
      </div>
    </header>

    <!-- Realtime Info Ticker Bar -->
    <div class="flex-none bg-gradient-to-r from-brand-900 via-brand-800 to-slate-900 text-emerald-50 px-3 sm:px-4 py-1.5 flex items-center justify-between text-[10.5px] font-bold shadow-inner border-b border-brand-950/80 gap-2 flex-wrap sm:flex-nowrap">
      <div class="flex items-center space-x-1.5 truncate">
        <i class="ph-bold ph-calendar-blank text-brand-300"></i>
        <span id="liveDateText">Memuat penanggalan...</span>
      </div>
      
      <!-- Realtime Google Sheets Sync Badge -->
      <div id="sheetsSyncBadge" onclick="muatDataDariSheets()" class="cursor-pointer flex items-center space-x-1.5 px-2.5 py-0.5 rounded-full bg-emerald-950/80 border border-emerald-500/30 text-[10px] text-emerald-300 hover:bg-emerald-900/80 transition select-none shadow-2xs group" title="Klik untuk sinkronkan ulang data dari Google Spreadsheet">
        <span id="sheetsSyncDot" class="w-1.5 h-1.5 rounded-full bg-emerald-400 group-hover:scale-125 transition"></span>
        <i id="sheetsSyncIcon" class="ph-bold ph-cloud-check text-xs"></i>
        <span id="sheetsSyncText">Google Spreadsheet Terhubung</span>
      </div>

      <div class="flex items-center space-x-1.5 bg-brand-950/70 px-2.5 py-0.5 rounded-full border border-brand-700/40 flex-shrink-0">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
        <i class="ph-bold ph-clock text-brand-300"></i>
        <span id="liveClockText" class="font-mono text-emerald-100">00:00:00 WIB</span>
      </div>
    </div>

    <!-- Main Scrollable Content Area -->
    <main id="mainContainer" class="flex-1 overflow-y-auto relative pb-safe focus:outline-none">
      <!-- Dynamic View Rendered Here -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav id="bottomNav" class="mt-auto flex-none z-50 glass-nav border-t border-emerald-100/90 px-2 py-1.5 shadow-[0_-4px_20px_rgba(0,0,0,0.06)]">
      <div class="grid grid-cols-5 gap-1 text-center" id="navItemWrapper">
        <!-- Navigation Buttons Rendered Dynamically -->
      </div>
    </nav>

  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed top-5 left-1/2 -translate-x-1/2 z-[110] flex flex-col gap-2 pointer-events-none w-11/12 max-w-sm"></div>

  <!-- Reusable Dynamic Modal -->
  <div id="modalContainer" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/65 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300">
    <div id="modalContent" class="bg-white rounded-3xl max-w-md w-full max-h-[92vh] overflow-y-auto shadow-2xl p-5 transform scale-95 transition-all duration-300 border border-slate-100">
      <!-- Modal Content Rendered Dynamically -->
    </div>
  </div>

  <!-- External Application Logic -->
  <script src="app.js"></script>
</body>
</html>
